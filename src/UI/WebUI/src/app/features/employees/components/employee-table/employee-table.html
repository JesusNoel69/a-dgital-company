<div class="employees__table">
  <div class="employees__table_header">
    <div>Employee</div>
    <hr />
    <div>Position</div>
    <hr />
    <div>Clock Number</div>
    <hr />
    <div>Status</div>
    <hr />
    <div>Action</div>
  </div>
  <hr class="separator sticky_separator" />
  @for (employee of employees(); track employee.clockNumber) {
    <employee-row [rowColor]="changeRowColor()" [employee]="employee"></employee-row>
  }
  <hr class="separator" />
</div>
