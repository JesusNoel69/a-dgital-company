<nav class="navbar">
  <div class="navbar__display">
    <img src="assets/logo.svg" class="navbar__logo" />
    <hr class="navbar__divider" />
    <h2 class="navbar__title">
      <button class="navbar__title" routerLink="" (click)="navigation.sectionSelected = ''">
        ADigitalCompany
      </button>
    </h2>
    <div class="navbar__spacer"></div>
  </div>
  <div class="navbar__display">
    <button class="navbar__icon">🔔</button>
    <hr class="navbar__divider" />
    <button class="navbar__profile" (click)="toggleMenu()">
      <img width="24" height="24" src="assets/user_icon.svg" />
      <div class="navbar__user">
        <span>User Name</span>
        <span>email@email.com</span>
      </div>
      <span>▼</span>
    </button>
    @if (showMenu()) {
      <div class="backdrop" (click)="showMenu.set(false)"></div>
      <div class="profile__menu">
        <button (click)="showMenu.set(false)" disabled>⚙ Configuration</button>
        <button (click)="showMenu.set(false)" disabled>🌙 Dark mode</button>
        <button
          (click)="showMenu.set(false); navigation.sectionSelected = ''"
          routerLink="dashboard/badge"
        >
          🪪 Badge
        </button>
        <hr />
        <button (click)="showMenu.set(false)" disbaled>🚪 Logout</button>
      </div>
    }
  </div>
</nav>
